<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srideep School Files</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Video -->
    <video id="backgroundVideo" autoplay loop playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>

    <!-- Video Play/Sound Button -->
    <button id="videoPlayBtn">🔊 Play Sound</button>

    <div class="container">

        <h1>📚 Srideep School Files</h1>
        <p>My personal school file storage</p>

        <div class="login-box">
            <h2>🔐 Login</h2>

            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">

            <button id="loginBtn">Login</button>

            <p id="message"></p>
        </div>

        <div id="schoolFilesSection">
            <h2>School Files</h2>

            <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png">

            <button id="uploadBtn">Upload File</button>

            <p id="uploadMessage"></p>

            <h3>Your Files</h3>

            <button id="logoutBtn">Logout</button>
            <button id="refreshBtn">Refresh Files</button>

            <div id="fileList"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

    <script>
        const backgroundVideo = document.getElementById("backgroundVideo");
        const videoPlayBtn = document.getElementById("videoPlayBtn");

        videoPlayBtn.addEventListener("click", async function () {
            try {
                await backgroundVideo.play();
                videoPlayBtn.style.display = "none";
            } catch (error) {
                console.log("Video could not play:", error);
            }
        });

        backgroundVideo.addEventListener("playing", function () {
            videoPlayBtn.style.display = "none";
        });
    </script>

</body>
</html>
